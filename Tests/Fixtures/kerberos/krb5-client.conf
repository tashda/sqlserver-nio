# Kerberos configuration for the macOS test process (KRB5_CONFIG). The KDC is
# the domain controller container, published on 127.0.0.1:1088.
[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1

[realms]
    LAB.TEST = {
        kdc = tcp/127.0.0.1:1088
    }

[domain_realm]
    localhost = LAB.TEST
