# Kerberos configuration for the test process (KRB5_CONFIG). The KDC is the
# domain controller container, published on the lab address, port 1088.
# start-server.sh fills in @LAB_ADDRESS@.
[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1

[realms]
    LAB.TEST = {
        kdc = tcp/@LAB_ADDRESS@:1088
    }

[domain_realm]
    @LAB_ADDRESS@ = LAB.TEST
