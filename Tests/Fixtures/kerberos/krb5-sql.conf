# Kerberos configuration inside the SQL Server container.
[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = true
    rdns = false

[realms]
    LAB.TEST = {
        kdc = dc1.lab.test
        admin_server = dc1.lab.test
    }

[domain_realm]
    .lab.test = LAB.TEST
    lab.test = LAB.TEST
